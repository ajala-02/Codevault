<div class="row g-3">
  <div class="col-md-8"><label class="form-label" for="name">Problem name <span class="text-danger">*</span></label><input class="form-control" id="name" name="name" value="{{ problem.name or '' }}" maxlength="120" required autofocus></div>
  <div class="col-md-4"><label class="form-label" for="platform">Platform <span class="text-danger">*</span></label><input class="form-control" id="platform" name="platform" placeholder="e.g. LeetCode" value="{{ problem.platform or '' }}" maxlength="60" required></div>
  <div class="col-12"><label class="form-label" for="url">Problem URL <span class="text-danger">*</span></label><input class="form-control" type="url" id="url" name="url" placeholder="https://..." value="{{ problem.url or '' }}" maxlength="500" required></div>
  <div class="col-md-4"><label class="form-label" for="difficulty">Difficulty <span class="text-danger">*</span></label><select class="form-select" id="difficulty" name="difficulty" required><option value="" {% if not problem.difficulty %}selected{% endif %} disabled>Select difficulty</option>{% for level in ['Easy', 'Medium', 'Hard'] %}<option value="{{ level }}" {% if problem.difficulty == level %}selected{% endif %}>{{ level }}</option>{% endfor %}</select></div>
  <div class="col-md-4"><label class="form-label" for="topic">Topic <span class="text-danger">*</span></label><input class="form-control" id="topic" name="topic" placeholder="e.g. Arrays" value="{{ problem.topic or '' }}" maxlength="60" required></div>
  <div class="col-md-4"><label class="form-label" for="date_solved">Date solved <span class="text-danger">*</span></label><input class="form-control" type="date" id="date_solved" name="date_solved" value="{{ problem.date_solved or '' }}" required></div>
  <div class="col-12"><label class="form-label" for="notes">Personal notes</label><textarea class="form-control" id="notes" name="notes" rows="5" maxlength="3000" placeholder="Approach, time complexity, things to revisit...">{{ problem.notes or '' }}</textarea></div>
</div>
