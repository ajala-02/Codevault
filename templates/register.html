{% extends "layout.html" %}
{% block title %}Register{% endblock %}
{% block main %}
<div class="auth-card card border-0 shadow-sm mx-auto">
  <div class="card-body p-4 p-md-5">
    <h1 class="h2 fw-bold">Create your vault</h1>
    <p class="text-secondary mb-4">Start keeping a record of every problem you solve.</p>
    <form action="{{ url_for('register') }}" method="post">
      <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" minlength="3" maxlength="30" required autofocus></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" name="password" minlength="6" required></div>
      <div class="mb-4"><label class="form-label" for="confirmation">Confirm password</label><input class="form-control" type="password" id="confirmation" name="confirmation" minlength="6" required></div>
      <button class="btn btn-primary w-100" type="submit">Create account</button>
    </form>
    <p class="text-center mt-4 mb-0 small">Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p>
  </div>
</div>
{% endblock %}
