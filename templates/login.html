{% extends "layout.html" %}
{% block title %}Login{% endblock %}
{% block main %}
<div class="auth-card card border-0 shadow-sm mx-auto">
  <div class="card-body p-4 p-md-5">
    <h1 class="h2 fw-bold">Welcome back</h1>
    <p class="text-secondary mb-4">Log in to continue tracking your progress.</p>
    <form action="{{ url_for('login') }}" method="post">
      <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" required autofocus></div>
      <div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" name="password" required></div>
      <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>
    <p class="text-center mt-4 mb-0 small">New to CodeVault? <a href="{{ url_for('register') }}">Create an account</a>.</p>
  </div>
</div>
{% endblock %}
